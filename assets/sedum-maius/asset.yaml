# descriptive: find it and understand it
id: sedum-maius
title: Sedum maius, houseleek in flower
description: Common houseleek (Sempervivum tectorum), a rosette of fleshy pointed leaves at the base over a thick root and trailing runners, from which a tall column-like stem densely clad in overlapping leaves rises and opens at the top into a crown of curled, spreading branches bearing many small star-shaped flowers; the whole reads as a symmetrical upright emblem. Dark brown-black woodcut line work with no ground line, on a transparent background.
