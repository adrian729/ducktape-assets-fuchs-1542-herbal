title: Seriphium absinthium, wormwood bush
description: A wormwood (Artemisia), three tall upright shoots rising from a thick twisted root at the lower right, each densely set from base to tip with finely divided feathery leaves; the shoots lean slightly apart and fill a tall rectangle with little open space. Dark brown-black woodcut line work with no ground line, on a transparent background.
