# descriptive: find it and understand it
id: anagallis-mas
title: Anagallis mas, pimpernel sprig
description: Scarlet pimpernel (Anagallis mas, the red-flowered pimpernel), a trailing plant whose thin stems arch up and outward from a fibrous root at the lower left, carrying pairs of pointed oval leaves, open five-petalled flowers and many round buds and seed capsules on short stalks; the arching stems leave open space in the middle. Dark brown-black woodcut line work with no ground line, on a transparent background.
