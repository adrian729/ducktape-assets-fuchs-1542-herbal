# descriptive: find it and understand it
id: alsine-media
title: Alsine media, chickweed tuft
description: Common chickweed (Stellaria media), a loose sprawling tuft of thin trailing stems that spread upward and outward from a small fibrous root at the bottom centre, set with pairs of small toothed oval leaves and tiny five-petalled flowers and buds at the tips; the tuft is wider at the top than at the root. Dark brown-black woodcut line work with no ground line, on a transparent background.
