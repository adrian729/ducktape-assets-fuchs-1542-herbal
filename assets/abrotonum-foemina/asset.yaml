id: abrotonum-foemina
title: Abrotonum foemina, upright flowering stem
description: A single tall upright stem rises from a short, many-branched root at the bottom; its lower half is bare and its upper half carries a narrow plume of side branches with finely divided leaves and small round button-like flower heads at the tips. Dark brown-black woodcut line work with no ground line, on a transparent background.
