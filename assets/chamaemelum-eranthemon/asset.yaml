id: chamaemelum-eranthemon
title: Chamaemelum eranthemon, flowering branch
description: An upright branching plant with a long slender root that takes up the lower third, whorls of narrow linear leaves along the thin stems, and about a dozen five-petalled flowers with hanging, parted petals at the branch tips; the crown spreads wider than the stem below it. Dark brown-black woodcut line work with no ground line, on a transparent background.
