id: plantago-maior
title: Plantago maior, greater plantain
description: Greater plantain (Plantago major), a rosette of six broad ribbed oval leaves on long stalks spreading left and right from a tangle of fibrous roots at the centre, with three tall narrow flower spikes rising from the middle; one leaf hangs down below the root. Dark brown-black woodcut line work with no ground line, on a transparent background.
